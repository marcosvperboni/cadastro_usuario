version: "3.9"

services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: cadastro_usuario
      POSTGRES_USER: cadastro_usuario
      POSTGRES_PASSWORD: cadastro_usuario
    ports:
      - "5432:5432"
    volumes:
      - cadastro_usuario_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadastro_usuario"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: cadastro_usuario
      DB_USER: cadastro_usuario
      DB_PASSWORD: cadastro_usuario
      JWT_SECRET: troque-esta-chave-em-producao-0123456789abcdef
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  cadastro_usuario_db_data:
