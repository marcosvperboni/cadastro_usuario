spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  security:
    jwt:
      secret: chave-secreta-de-teste-nao-usar-em-producao-0123456789
      expiracao-ms: 3600000
    reset-token:
      expiracao-minutos: 30
    cors:
      allowed-origins: http://localhost:4200
